[project]
name = "python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2",
    "polars>=1.6.0",
    "pyarrow>=17.0.0",
    "requests>=2.32.3",
]

[project.optional-dependencies]
# Data engineering: databases, ETL helpers
de = [
    "duckdb>=1.1.3",
    "SQLAlchemy>=1.4.36,<2.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",
]

# Pandas stack (optional if you prefer just Polars)
pandas = [
    "pandas==2.1.4",
    "openpyxl>=3.1.5",
]

# Visualization
viz = [
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "plotly>=5.24.1",
]

# Altair (optional: conflicts with some packages like great-expectations)
altair = [
    "altair>=4.2.1,<5.0.0",
]

# Machine learning / modeling
ml = [
    "scikit-learn>=1.5.2",
]

# Notebooks
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.2.5",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
]

# Development tools
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
]

# Cloud storage & BigQuery
cloud = [
    "fsspec>=2024.6.1",
    "s3fs>=2024.6.1",
    "gcsfs>=2024.6.1",
    "boto3>=1.35.29",
    "google-cloud-storage>=2.18.2",
    "google-cloud-bigquery>=3.26.0",
    "pandas-gbq>=0.24.0",
    "db-dtypes>=1.3.0",
]

# Google Gemini (Generative AI)
genai = [
    "google-generativeai>=0.8.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.2",
]

# Orchestration (Dagster only)
orchestration = [
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
]

# Airflow (install with constraints if needed)
airflow = [
    "apache-airflow==2.10.2",
]

# Data transformation (dbt)
transform = [
    "dbt-core>=1.8.7",
    "dbt-bigquery>=1.8.3",
    "dbt-postgres>=1.8.3",
    "dbt-snowflake>=1.8.4",
    "dbt-redshift>=1.8.1",
]

# Data quality
vq = [
    "pandera>=0.20.4",
    "great-expectations>=1.4.4",
]

# Streaming
streaming = [
    "kafka-python>=2.0.2"
]

# Geospatial
go = [
    "geopandas>=1.0.1",
    "shapely>=2.0.5",
    "pyproj>=3.6.1",
]

# Time series
timeseries = [
    "prophet>=1.1.5",
    "darts>=0.30.0",
]

# Performance
performance = [
    "numba>=0.60.0",
    "orjson>=3.10.7",
]

# Notebook polish/notebook tooling
notebook_polish = [
    "jupytext>=1.16.4",
    "nbqa>=1.9.1,<1.9.2",
    "pre-commit>=4.0.1",
]

# Supabase client
supabase = [
    "supabase>=2.6.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
# Enable common rule sets; adjust as you like
select = ["E", "F", "I", "UP", "B"]
fix = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
